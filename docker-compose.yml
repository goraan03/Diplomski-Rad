services:
  mysql:
    image: mysql:8.0
    container_name: ft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ft-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: ft-identity
    restart: unless-stopped
    env_file: .env
    environment:
      IDENTITY_DB_HOST: mysql
      IDENTITY_DB_PORT: "3306"
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["sh", "-c", "node services/identity/dist/migrate.js && node services/identity/dist/index.js"]
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  coaching:
    build:
      context: .
      dockerfile: services/coaching/Dockerfile
    container_name: ft-coaching
    restart: unless-stopped
    env_file: .env
    environment:
      COACHING_DB_HOST: mysql
      COACHING_DB_PORT: "3306"
      COACHING_DB_USER: ${COACHING_DB_USER:-coaching_user}
      COACHING_DB_PASSWORD: ${COACHING_DB_PASSWORD:-coaching_pass}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
    command: ["sh", "-c", "node services/coaching/dist/migrate.js && node services/coaching/dist/index.js"]
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ft-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${GATEWAY_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      IDENTITY_URL: http://identity:4001
      COACHING_URL: http://coaching:4002
      LEGACY_URL: ${LEGACY_URL:-}
    ports:
      - "4000:4000"
    depends_on:
      identity:
        condition: service_healthy
      coaching:
        condition: service_healthy

volumes:
  mysql-data: